services:
    speedtest-tracker:
        image: lscr.io/linuxserver/speedtest-tracker:latest
        restart: unless-stopped
        container_name: speedtest-tracker
        ports:
            - 8080:80
            - 8443:443
        environment:
            - PUID=1000 
            - PGID=1000
            # - APP_KEY=base64:SOMETHING= 
            - APP_URL=https://speedtest.love.io:8443
            - DB_CONNECTION=sqlite
            - APP_DEBUG=true
        volumes:
            - ./data:/config
            - ./keys:/config/keys
