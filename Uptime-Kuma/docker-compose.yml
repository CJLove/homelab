---
version: "3.1"

services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    volumes:
      - /home/dash/data:/app/data
    ports:
      - 3010:3001
    environment:
      - UPTIME_KUMA_SSL_KEY=/app/data/registry.key
      - UPTIME_KUMA_SSL_CERT=/app/data/registry.crt
      - NODE_EXTRA_CA_CERTS=/app/data/ca.crt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
